openapi: 3.0.3
info:
  title: SupplyBridge B2B Supplier Order & Inventory API
  description: |
    RESTful B2B API allowing corporate procurement clients to inspect catalogues, check inventory availability,
    place wholesale purchase orders, track order lifecycles, and execute cancellations.
  version: 1.0.0
  contact:
    name: SupplyBridge QA & Engineering
    email: qa-team@supplybridge.internal
servers:
  - url: http://localhost:8081
    description: Local AUT Server (Default Port)
  - url: http://localhost:8080
    description: Alternative Local Server Port

paths:
  /api/v1/customers:
    get:
      summary: Retrieve all registered customers
      operationId: getAllCustomers
      tags:
        - Customers
      responses:
        '200':
          description: Successful retrieval of customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'

  /api/v1/customers/{id}:
    get:
      summary: Retrieve customer details by ID
      operationId: getCustomerById
      tags:
        - Customers
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of customer
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/products:
    get:
      summary: Retrieve product catalogue and current inventory levels
      operationId: getAllProducts
      tags:
        - Products
      responses:
        '200':
          description: Product catalogue list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /api/v1/products/{id}:
    get:
      summary: Retrieve product details by ID
      operationId: getProductById
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric ID of product
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/products/{id}/stock:
    patch:
      summary: Adjust product warehouse inventory (Restock or manual correction)
      operationId: adjustProductStock
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustStockRequest'
      responses:
        '200':
          description: Stock adjusted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '422':
          description: Stock cannot be adjusted below zero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders:
    post:
      summary: Place a new purchase order
      operationId: createOrder
      tags:
        - Orders
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderApiResponse'
        '400':
          description: Invalid request body, malformed JSON, or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid X-API-KEY header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated customer forbidden from placing order on behalf of another customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Customer ID or Product ID does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient inventory, negative quantity, or customer account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}:
    get:
      summary: Retrieve order details by ID
      operationId: getOrderById
      tags:
        - Orders
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderApiResponse'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Customer does not own this order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order ID not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/customer/{customerId}:
    get:
      summary: Retrieve all orders belonging to a customer
      operationId: getOrdersByCustomer
      tags:
        - Orders
      security:
        - ApiKeyAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of orders for customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListApiResponse'
        '403':
          description: Cannot query orders of other customer accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel an eligible order and restore product inventory
      operationId: cancelOrder
      tags:
        - Orders
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order cancelled successfully and stock restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Customer forbidden from cancelling another customer's order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Order already CANCELLED or COMPLETED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}/status:
    patch:
      summary: Update order status transition
      operationId: updateOrderStatus
      tags:
        - Orders
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderApiResponse'
        '422':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: B2B Customer API Key Authentication Header

  schemas:
    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        companyName:
          type: string
          example: Apex Logistics Ltd
        contactName:
          type: string
          example: Sarah Jenkins
        email:
          type: string
          example: orders@apexlogistics.co.uk
        apiKey:
          type: string
          example: sb_live_cust_apex_7781
        status:
          type: string
          example: ACTIVE
        createdAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        sku:
          type: string
          example: IND-PAL-001
        name:
          type: string
          example: Heavy Duty Euro Pallet (Grade A)
        description:
          type: string
          example: Standard Euro pallet, treated wood
        unitPrice:
          type: number
          format: float
          example: 24.50
        availableStock:
          type: integer
          example: 500
        status:
          type: string
          example: IN_STOCK

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 100
        orderNumber:
          type: string
          example: ORD-2026-3E6F775E
        customerId:
          type: integer
          example: 1
        customerName:
          type: string
          example: Apex Logistics Ltd
        productId:
          type: integer
          example: 2
        productName:
          type: string
          example: Industrial Stretch Film (23 Micron)
        productSku:
          type: string
          example: IND-STR-002
        quantity:
          type: integer
          example: 10
        unitPrice:
          type: number
          example: 14.75
        totalAmount:
          type: number
          example: 147.50
        status:
          type: string
          example: CONFIRMED
        idempotencyKey:
          type: string
          example: idem-key-001
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required:
        - customerId
        - productId
        - quantity
      properties:
        customerId:
          type: integer
          example: 1
        productId:
          type: integer
          example: 2
        quantity:
          type: integer
          minimum: 1
          example: 10
        idempotencyKey:
          type: string
          example: client-req-unique-uuid-99

    UpdateStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
          example: COMPLETED

    AdjustStockRequest:
      type: object
      required:
        - stockChange
      properties:
        stockChange:
          type: integer
          example: 50

    CustomerListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'

    CustomerResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Customer'

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Product'

    OrderApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Order'

    OrderListApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: BUSINESS_RULE_VIOLATION
        data:
          type: object
          nullable: true
        errors:
          type: array
          items:
            type: string
          example: ["Insufficient inventory. Requested: 9999, available stock: 110"]
        timestamp:
          type: string
          format: date-time
